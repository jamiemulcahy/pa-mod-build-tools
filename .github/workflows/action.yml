# The action's end-to-end test: what a mod author writes is what gets tested.
#
# A composite action runs in the workspace, so the fixture repository has to *be* the
# workspace. This project is checked out to _action and a mod repository is built around it,
# with a bare repository standing in for the remote. Nothing here touches the network.
name: Action

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the action
        uses: actions/checkout@v4
        with:
          path: _action

      # Deliberately no fetch-depth, token or setup-node in this job.
      - name: Build a mod repository around the workspace
        run: |
          set -eux
          git init -q --bare "$RUNNER_TEMP/origin.git"
          git init -q -b main .
          git config user.email mod@author.test && git config user.name "Mod Author"
          mkdir -p Mod/pa
          echo '{"identifier":"com.example.mod"}' > Mod/modinfo.json
          echo 'tank' > Mod/pa/tank.json
          echo 'zip' > Mod/pachat.zip
          echo '{ "root": "Mod", "ignore": ["pachat.zip"] }' > .modbuild
          echo '_action/' > .gitignore
          git add -A && git commit -qm initial
          git remote add origin "$RUNNER_TEMP/origin.git"
          git push -q -u origin main

      - name: Publish (dry run)
        uses: ./_action
        with:
          dry-run: 'true'

      - name: A dry run pushes nothing
        run: |
          set -eu
          test -z "$(git -C "$RUNNER_TEMP/origin.git" branch --list published-mod)"

      - name: Publish
        uses: ./_action

      - name: The branch holds the payload, with the root prefix stripped
        run: |
          set -eu
          got=$(git -C "$RUNNER_TEMP/origin.git" ls-tree -r --name-only published-mod | sort | tr '\n' ' ')
          echo "published: $got"
          test "$got" = "modinfo.json pa/tank.json "

      - name: Publish again with nothing changed
        uses: ./_action

      - name: An unchanged run makes no commit
        run: |
          set -eu
          test "$(git -C "$RUNNER_TEMP/origin.git" rev-list --count published-mod)" = "1"

      - name: A later push to the source branch
        run: |
          set -eux
          echo 'bot' > Mod/pa/bot.json
          git add -A && git commit -qm "add bot" && git push -q origin main

      - name: Publish the change
        uses: ./_action

      - name: History accumulates rather than being force-pushed over
        run: |
          set -eu
          test "$(git -C "$RUNNER_TEMP/origin.git" rev-list --count published-mod)" = "2"
          git -C "$RUNNER_TEMP/origin.git" ls-tree -r --name-only published-mod | grep -qx 'pa/bot.json'
