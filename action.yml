# A thin adapter over `pa-mod-build publish`. Every input maps onto an option the command
# already has, and nothing is decided here.
#
# This file lives at the repository root because a GitHub Marketplace listing requires it.
name: 'PA Mod Publish'
description: 'Publish a clean Planetary Annihilation mod payload to its own branch'
author: 'jamiemulcahy'

branding:
  icon: 'package'
  color: 'orange'

inputs:
  source:
    description: 'Branch, tag or commit to build the mod from. The default builds whatever actions/checkout checked out.'
    default: 'HEAD'
  config:
    description: 'Path to the .modbuild file, resolved relative to the repository.'
    default: '.modbuild'
  dry-run:
    description: 'Report what would be published, writing and pushing nothing.'
    default: 'false'

# There is deliberately no `target` input: the publish branch belongs to the mod, so it is set
# in .modbuild. Nor is there a `token` input — the action uses whatever actions/checkout
# persisted.
runs:
  using: 'composite'
  steps:
    - name: Install
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

    # Inputs are passed through the environment rather than interpolated into the command line,
    # so no value can be read as shell syntax.
    - name: Publish mod
      shell: bash
      run: node "$GITHUB_ACTION_PATH/src/publish.js" publish --source "$SOURCE" --config "$CONFIG" ${DRY_RUN:+--dry-run}
      env:
        SOURCE: ${{ inputs.source }}
        CONFIG: ${{ inputs.config }}
        DRY_RUN: ${{ inputs.dry-run == 'true' && '1' || '' }}
