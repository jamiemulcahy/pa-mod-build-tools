# A thin adapter over `pa-mod-build publish`. Every input maps onto an option the command
# already has, and nothing is decided here.
#
# This file lives at the repository root because a GitHub Marketplace listing requires it.
name: 'PA Mod Publish'
description: 'Publish a clean Planetary Annihilation mod payload to its own branch'
author: 'jamiemulcahy'

branding:
  icon: 'package'
  color: 'orange'

inputs:
  dry-run:
    description: 'Report what would be published, writing and pushing nothing.'
    default: 'false'

# This is the whole input surface. The publish branch belongs to the mod, so it is set in
# .modbuild rather than here; the mod is built from whatever actions/checkout checked out; and
# the push uses whatever credentials actions/checkout persisted.
runs:
  using: 'composite'
  steps:
    - name: Install
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

    # dry-run is compared against both spellings and anything else stops the run. Treating an
    # unrecognised value as "false" would publish for real on `dry-run: 'yes'`, which is the one
    # mistake this input exists to make impossible.
    - name: Publish mod
      shell: bash
      run: |
        set -eu
        case "$DRY_RUN" in
          true) set -- --dry-run ;;
          false) set -- ;;
          *) echo "::error::dry-run must be 'true' or 'false', but it is '$DRY_RUN'. Nothing was published."; exit 1 ;;
        esac
        node "$GITHUB_ACTION_PATH/src/publish.js" publish "$@"
      env:
        DRY_RUN: ${{ inputs.dry-run }}
