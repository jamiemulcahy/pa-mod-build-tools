# action.yml
#
# A thin adapter over `pa-mod-build publish`. Every input maps onto an option the command
# already has, and nothing is decided here — see docs/specs/action.md.
#
# This file lives at the repository root because a GitHub Marketplace listing requires it.
name: 'PA Mod Publish'
description: 'Publish a clean Planetary Annihilation mod payload to its own branch'
author: 'jamiemulcahy'

branding:
  icon: 'package'
  color: 'orange'

inputs:
  source:
    description: >-
      Branch, tag or commit to build the mod from. The default builds whatever
      actions/checkout checked out, which is the right answer for every trigger.
    required: false
    default: 'HEAD'
  config:
    description: 'Path to the .modbuild file, resolved relative to the repository.'
    required: false
    default: '.modbuild'
  dry-run:
    description: 'Resolve and report what would be published, writing and pushing nothing.'
    required: false
    default: 'false'

# There is deliberately no `target`, `token`, `push` or `repo` input. Each omission is load
# bearing and is explained in docs/specs/action.md; test/action.test.js asserts they stay absent.

runs:
  using: 'composite'
  steps:
    # actions/setup-node is deliberately not used. It would change the Node version for every
    # later step in the caller's job, which is not something a mod-publishing step should do to
    # a workflow it knows nothing about. GitHub-hosted runners already ship Node 20 or newer, so
    # this check passes silently there and earns its place on self-hosted runners, where the
    # alternative is a syntax error from somewhere inside the tool.
    - name: Check Node
      shell: bash
      run: |
        set -eu
        if ! command -v node >/dev/null 2>&1; then
          echo "::error::Node is not available on this runner. PA Mod Publish needs Node 20 or newer. Add a step running actions/setup-node@v4 with node-version: 20 before this one."
          exit 1
        fi
        version="$(node --version)"
        major="${version#v}"
        major="${major%%.*}"
        if [ "$major" -lt 20 ]; then
          echo "::error::Node $version is too old. PA Mod Publish needs Node 20 or newer. Add a step running actions/setup-node@v4 with node-version: 20 before this one."
          exit 1
        fi
        echo "Using Node $version"

    # Needs package-lock.json committed: `ignore` is a runtime dependency and is installed here
    # rather than vendored.
    - name: Install
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

    # $GITHUB_ACTION_PATH is this action's own checkout, so the command runs from source with
    # nothing published to a registry. The working directory is the caller's workspace, which is
    # the repository being published. The report reaches the run page on its own: the command
    # writes to $GITHUB_STEP_SUMMARY whenever the runner sets it.
    - name: Publish mod
      shell: bash
      run: node "$GITHUB_ACTION_PATH/src/cli.js" publish
      env:
        PAMB_SOURCE: ${{ inputs.source }}
        PAMB_CONFIG: ${{ inputs.config }}
        PAMB_DRY_RUN: ${{ inputs.dry-run }}
